<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>LAWgico Cálculos · Peixoto &amp; Cury</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Sora:wght@300;800&display=swap" rel="stylesheet">
<style>
:root{
  --side:#0a1d2e; --side2:#00294A; --bg:#F2F5F8; --card:#fff; --ink:#0E2841; --muted:#5d6b7a; --line:#dfe5ec;
  --cyan:#00AEEF; --cyan2:#009DDC; --navy:#0E2841; --ok:#1E7A3E; --okbg:#e6f4ea; --warn:#9a6700; --warnbg:#fff4d6; --bad:#b42318; --badbg:#fde8e6;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--cyan2)}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
/* sidebar */
.side{background:linear-gradient(180deg,#001E36,#00294A);color:#cfe3f1;padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.marca{text-align:center;margin:4px 0 22px}
.marca .wm{font-family:Sora,sans-serif;font-size:30px;color:#fff;letter-spacing:.5px}
.marca .wm b{font-weight:800}.marca .wm span{font-weight:300}
.marca .tag{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--cyan)}
.marca .sub{font-size:11px;color:#8fb2cc;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{all:unset;cursor:pointer;padding:10px 12px;border-radius:10px;color:#cfe3f1;font-weight:500;display:flex;justify-content:space-between;align-items:center}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav a{text-decoration:none;padding:10px 12px;border-radius:10px;color:#cfe3f1;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.06)}.nav a.on{background:rgba(0,174,239,.16);color:#fff;box-shadow:inset 3px 0 0 var(--cyan)}
.nav button.on{background:rgba(0,174,239,.16);color:#fff;box-shadow:inset 3px 0 0 var(--cyan)}
.nav button[disabled]{opacity:.45;cursor:default}
.nav .em{font-size:10px;text-transform:uppercase;letter-spacing:1px;background:rgba(255,255,255,.1);padding:2px 6px;border-radius:6px}
.side .rod{margin-top:auto;font-size:11px;color:#7e9db4;line-height:1.4}
/* main */
main{padding:26px 30px 60px;min-width:0}
.topo{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.topo h1{font-size:22px;margin:0}
.topo .acoes{display:flex;gap:8px;flex-wrap:wrap}
.acordo input{font:inherit;border:1px solid var(--line);border-radius:10px;padding:7px 10px;width:100%}
.acordo .campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0}
.acordo label{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
select,.btn{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 12px}
.btn{cursor:pointer;font-weight:600}
.saidas{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 0}.saidas span{font-size:12px;color:var(--muted)}
.cent{margin-bottom:16px}.cent .linha1{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.cent .st{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:20px;background:#eef2f6;color:var(--muted)}
.cent .st.em_revisao{background:#e6f4fb;color:#075985}.cent .st.revisado{background:var(--okbg);color:var(--ok)}.cent .st.devolvido{background:var(--warnbg);color:var(--warn)}.cent .st.entregue{background:#e9e7fd;color:#3b2f8f}
.cent .abas{display:flex;gap:6px;margin:12px 0 8px;flex-wrap:wrap}.cent .abas button{all:unset;cursor:pointer;font-size:13px;font-weight:600;padding:5px 10px;border-radius:8px;color:var(--muted)}
.cent .abas button.on{background:#e6f4fb;color:#075985}
.cent .chk-item{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:6px 0}.cent .chk-item input[type=text]{flex:1;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.cent textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px;min-height:60px}
.cent .msg{font-size:13px;margin-top:6px}
.imp .dz{border:2px dashed #b9dff0;border-radius:14px;padding:22px;text-align:center;background:#f5fbfe;cursor:pointer;color:#33475b}
.imp .dz.sobre{border-color:#00AEEF;background:#eaf7fd}
.imp tr.dv td{background:#fff4f2}.imp tr.dv td.d{color:#b42318;font-weight:700}
.imp .veredito{margin:12px 0;padding:12px 14px;border-radius:12px;font-size:14px}
.imp .veredito.ok{background:#e6f4ea;color:#14532d;border:1px solid #b7dfc3}.imp .veredito.no{background:#fff4f2;color:#7a1d12;border:1px solid #f3c4bd}
.imp textarea{width:100%;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:44px}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.hero{background:radial-gradient(120% 140% at 100% 0%,rgba(0,174,239,.35),transparent 55%),linear-gradient(135deg,#001E36,#00294A);color:#fff;border-radius:14px;padding:22px 24px;display:grid;grid-template-columns:1.3fr repeat(3,1fr);gap:18px;align-items:end}
.hero .proc .k{font-size:12px;color:#9cc3dd;text-transform:uppercase;letter-spacing:1.2px}
.hero .proc .nome{font-size:19px;font-weight:700;margin:2px 0}
.hero .proc .cnj{font-size:13px;color:#cfe3f1}
.kpi .k{font-size:12px;color:#9cc3dd}
.kpi .v{font-size:22px;font-weight:800;letter-spacing:-.3px}
.kpi .s{font-size:12px;color:#9cc3dd}
.selo{margin-top:14px;display:flex;gap:10px;align-items:flex-start;background:var(--okbg);border:1px solid #b7dfc3;color:#14532d;border-radius:12px;padding:12px 14px;font-size:14px}
.selo.parcial{background:var(--warnbg);border-color:#f0d58a;color:#5c4100}
.selo b{display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.card h2{font-size:15px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 small{font-weight:500;color:var(--muted);font-size:12px}
dl.par{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:14px}
dl.par dt{color:var(--muted)}dl.par dd{margin:0;font-weight:600}
.pend{font-size:13px;color:var(--muted);margin:0;padding-left:18px}
.pend li{margin:3px 0}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 8px;border-bottom:1px solid #eef2f6;vertical-align:top}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.verba{cursor:pointer}
.tbl tr.verba:hover td{background:#f7fafc}
.tbl tr.tot td{font-weight:800;border-top:2px solid var(--ink);border-bottom:none}
.tipo{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.chk{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.chk.ok{background:var(--okbg);color:var(--ok)}.chk.dif{background:var(--badbg);color:var(--bad)}.chk.na{background:#eef2f6;color:var(--muted)}
.det td{background:#fafcfd;padding:0}
.det .wrap{padding:6px 10px 14px;overflow:auto}
.det table{width:100%;border-collapse:collapse;font-size:13px}
.det th{font-size:11px;color:var(--muted);text-align:right;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
.det th:first-child,.det td:first-child{text-align:left}
.det td{text-align:right;padding:5px 6px;border-bottom:1px solid #eef2f6;font-variant-numeric:tabular-nums;white-space:nowrap}
.det tr.x td{background:var(--badbg)}
.inf{font-size:10px;font-weight:700;color:var(--cyan2);text-transform:uppercase;margin-left:4px}
.seta{display:inline-block;width:14px;color:var(--muted);transition:transform .15s}
tr.aberta .seta{transform:rotate(90deg)}
.vazio{text-align:center;padding:60px 20px;color:var(--muted)}
.lnk{all:unset;cursor:pointer;color:var(--cyan2);font-size:13px;font-weight:600}
.tbl.res td{padding:7px 4px}
.tbl.res tr.sub td{font-weight:700;border-top:1px solid var(--line)}
.n.neg{color:var(--muted)}
details.bloco{margin-top:16px;padding:0}
details.bloco summary{list-style:none;cursor:pointer;padding:16px 20px}
details.bloco summary::-webkit-details-marker{display:none}
details.bloco summary h2{margin:0;justify-content:flex-start}
details.bloco summary h2::before{content:'\203A';display:inline-block;margin-right:4px;color:var(--muted);transition:transform .15s}
details.bloco[open] summary h2::before{transform:rotate(90deg)}
details.bloco .wrap{padding:0 20px 18px}
table.mini{width:100%;border-collapse:collapse;font-size:13px}
table.mini th{font-size:11px;color:var(--muted);text-align:right;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.mini td{text-align:right;padding:5px 6px;border-bottom:1px solid #eef2f6;font-variant-numeric:tabular-nums;white-space:nowrap}
table.mini th:first-child,table.mini td:first-child{text-align:left}
table.mini tr.x td{background:var(--badbg)}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 16px}
  .marca{margin:0 12px 0 0;text-align:left}.marca .wm{font-size:22px}.marca .tag,.marca .sub{display:none}
  .nav{flex-direction:row;flex-wrap:wrap}.side .rod{display:none}
  main{padding:16px}
  .hero{grid-template-columns:1fr 1fr}.hero .proc{grid-column:1/-1}
  .grid2{grid-template-columns:1fr}
  .tbl .esc{display:none}
  .scroll{overflow-x:auto}
}
  .pecaform{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
  .pecaform label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
  .pecaform input,.pecaform select{font:inherit;font-size:13.5px;padding:7px 9px;border:1px solid var(--line,#d6dde6);border-radius:8px;min-width:150px;color:inherit;background:#fff}
</style>
<link rel="stylesheet" href="visual.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <img class="logo-pc" src="img/logo_pc_branca.png" alt="Peixoto &amp; Cury Advogados">
    <div class="marca">
      <div class="tag">cálculos</div>
      <div class="wm"><b>LAW</b><span>gico</span></div>
      <div class="sub">lawyers at work</div>
    </div>
    <nav class="nav">
      <a href="index.html">Cálculos da equipe</a>
      <a href="novo.html">Novo cálculo</a>
      <a href="index.html?tipo=impugnacao" id="navImp">Impugnações</a>
      <a class="on" href="resultado.html">Resultado do cálculo</a>
      <a href="index.html#equipe" id="navEquipe" hidden>Equipe</a>
    </nav>
    <div class="rod">Plataforma de Cálculos Peixoto &amp; Cury<br>Motor <span id="versao"></span> · tabelas do PJe-Calc (TRT 2ª Região) até <span id="tabAte"></span></div>
  </aside>

  <main>
    <div class="topo">
      <h1>Resultado do cálculo</h1>
      <div class="acoes">
        <select id="selCaso" aria-label="Caso"><option value="">Escolha um caso…</option></select>
        <label class="btn">Abrir caso<input id="arq" type="file" accept=".json" hidden></label>
      </div>
    </div>
    <div id="centralBox"></div>
    <div id="conteudo"><div class="card vazio">Escolha um caso para ver o cálculo.</div></div>
  </main>
</div>

<script src="motor/tabelas.js"></script>
<script src="motor/motor.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="motor/acordo.js"></script>
<script src="saidas.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
<script src="varas.js"></script>
<script src="impugnacao.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="central.js"></script>
<script>
(function(){
  const $ = s => document.querySelector(s);
  const brl = v => (v ?? 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
  const num = (v, d=2) => v == null ? '' : v.toLocaleString('pt-BR', {minimumFractionDigits:d, maximumFractionDigits:d});
  const dt = s => s ? s.split('-').reverse().join('/') : '';
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const NOMES_INDICE = {IPCAE:'IPCA-E', IPCA:'IPCA', TR:'TR', INPC:'INPC', SEM_CORRECAO:'sem correção'};
  $('#versao').textContent = MotorPC.versao;
  $('#tabAte').textContent = dt(TABELAS.atualizadoEm);

  // casos de teste locais (pasta bancada/casos, só existe na máquina; nunca vai para o GitHub)
  fetch('../bancada/casos/').then(r => r.ok ? r.text() : '').then(html => {
    const nomes = [...html.matchAll(/href="([^"]+\.json)"/g)].map(m => decodeURIComponent(m[1]));
    for (const n of nomes) { const o = document.createElement('option'); o.value = n; o.textContent = n.replace(/\.json$/,'').replace(/_/g,' '); $('#selCaso').append(o); }
    const q = new URLSearchParams(location.search).get('caso');
    const alvo = q && nomes.find(n => n.toLowerCase().includes(q.toLowerCase()));
    if (alvo) { $('#selCaso').value = alvo; carregar(alvo); }
  }).catch(() => {});
  $('#selCaso').addEventListener('change', e => e.target.value && carregar(e.target.value));
  $('#arq').addEventListener('change', async e => { const f = e.target.files[0]; if (f) mostrar(JSON.parse(await f.text())); });

  async function carregar(nome){ mostrar(await (await fetch('../bancada/casos/' + encodeURIComponent(nome))).json()); }

  // cálculo montado na tela "Novo cálculo" (passado pela sessão do navegador)
  if (new URLSearchParams(location.search).get('origem') === 'montado') {
    try { const c = JSON.parse(localStorage.getItem('casoMontado') || 'null'); if (c) setTimeout(() => mostrar(c), 0); } catch (e) {}
  }


  // ---------- cálculo da central (?id=...) ----------
  const idCentral = new URLSearchParams(location.search).get('id');
  if (idCentral) abrirCentral(idCentral, +new URLSearchParams(location.search).get('v') || null);
  async function abrirCentral(id, numero) {
    const box = $('#centralBox');
    const u = await CentralPC.eu().catch(() => null);
    if (!u) { box.innerHTML = '<div class="card">Entre na central para abrir este cálculo: <a href="index.html">fazer login</a>.</div>'; return; }
    let c, v, vers, docs, evs, revs;
    try {
      [c, v, vers, docs, evs, revs] = await Promise.all([CentralPC.calculo(id), CentralPC.versao(id, numero), CentralPC.versoes(id),
        CentralPC.documentos(id), CentralPC.eventos(id), CentralPC.revisoes(id)]);
    } catch (e) { box.innerHTML = `<div class="card">Não consegui abrir o cálculo: ${esc(e.message)}</div>`; return; }
    if (!v) { box.innerHTML = '<div class="card">Este cálculo ainda não tem versão salva.</div>'; return; }
    document.querySelector('.topo h1').textContent = `${CentralPC.TIPOS[c.tipo] || c.tipo} · ${c.cnj}`;
    document.querySelector('.topo .acoes').innerHTML = '<a class="btn" href="index.html">Voltar para a lista</a>';
    v.caso.processo = Object.assign({}, v.caso.processo, { cnj: c.cnj, reclamante: c.reclamante || '', reclamado: c.reclamado || '' });
    mostrar(v.caso);
    const ehUltima = v.numero === c.versao_atual, podeRevisar = ['revisor', 'admin'].includes(u.papel);
    const dh = x => new Date(x).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    const acoes = [];
    if (ehUltima && ['rascunho', 'devolvido'].includes(c.status)) acoes.push('<button class="btn pri" data-st="em_revisao">Enviar para revisão</button>');
    if (ehUltima && c.status === 'revisado') acoes.push('<button class="btn pri" data-st="entregue">Marcar como entregue</button>');
    if (c.status !== 'arquivado') acoes.push('<button class="btn" data-st="arquivado">Arquivar</button>');
    const ultRev = revs[0];
    box.innerHTML = `<div class="card cent">
      <div class="linha1"><div><span class="st ${c.status}">${esc(CentralPC.STATUS[c.status] || c.status)}</span>
        <b style="margin-left:8px">${esc(c.cliente)}</b> · versão ${v.numero}${ehUltima ? '' : ` (a atual é a ${c.versao_atual})`} · responsável ${esc(c.responsavel_nome || '')}${c.revisor_nome ? ` · revisão ${esc(c.revisor_nome)}` : ''}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">${acoes.join('')}</div></div>
      ${ultRev && ultRev.resultado === 'devolvido' && c.status === 'devolvido' ? `<div class="selo parcial"><span>!</span><div><b>Devolvido por ${esc(ultRev.revisor_nome)}</b>${esc(ultRev.comentario || '')}${
        (ultRev.checklist || []).filter(x => !x.ok).map(x => `<div>• ${esc(x.item)}${x.obs ? ': ' + esc(x.obs) : ''}</div>`).join('')}</div></div>` : ''}
      <div class="abas">${['Revisão', 'Versões', 'Documentos', 'Histórico'].map((a, i) => `<button data-aba="${i}" class="${i === 0 ? 'on' : ''}">${a}</button>`).join('')}</div>
      <div data-painel="0">${c.status === 'em_revisao' && ehUltima && podeRevisar ? `
          <div style="font-size:13px;color:var(--muted);margin-bottom:6px">Marque cada item conferido. Item sem marca precisa de observação para devolver.</div>
          ${CentralPC.CHECKLIST.map((it, i) => `<div class="chk-item"><input type="checkbox" id="ck${i}"><label for="ck${i}" style="flex:2">${esc(it)}</label><input type="text" id="ob${i}" placeholder="observação"></div>`).join('')}
          <textarea id="rvCom" placeholder="Comentário da revisão"></textarea>
          <div style="display:flex;gap:8px;margin-top:8px"><button class="btn pri" id="rvOk">Aprovar</button><button class="btn" id="rvDev">Devolver para ajuste</button></div>`
        : (revs.length ? revs.map(r => `<div style="margin:6px 0"><b>${r.resultado === 'aprovado' ? 'Aprovado' : 'Devolvido'}</b> por ${esc(r.revisor_nome)} em ${dh(r.criado_em)} (versão ${r.versao}): ${(r.checklist || []).filter(x => x.ok).length} de ${(r.checklist || []).length} itens conferidos${r.comentario ? ' · ' + esc(r.comentario) : ''}</div>`).join('')
          : `<div style="font-size:14px;color:var(--muted)">${c.status === 'em_revisao' ? 'Aguardando revisão.' : 'Ainda não revisado. Envie para revisão quando terminar.'}</div>`)}</div>
      <div data-painel="1" hidden>${vers.map(x => `<div style="margin:5px 0"><a href="resultado.html?id=${id}&v=${x.numero}">Versão ${x.numero}</a> · ${esc(x.criado_por_nome || '')} · ${dh(x.criado_em)}${x.totais ? ` · líquido ${brl(x.totais.liquido)}` : ''}${x.observacao ? ' · ' + esc(x.observacao) : ''}</div>`).join('')}</div>
      <div data-painel="2" hidden>${docs.length ? docs.map(d => `<div style="margin:5px 0"><button class="lnk" data-doc="${esc(d.storage_path)}">${esc(d.nome)}</button> <span style="color:var(--muted);font-size:12px">${esc(d.tipo || '')}</span></div>`).join('') : '<div style="color:var(--muted)">Nenhum documento.</div>'}</div>
      <div data-painel="3" hidden>${evs.map(e => `<div style="margin:4px 0;font-size:14px">${dh(e.criado_em)} · <b>${esc(e.usuario_nome || '')}</b> · ${esc({ criado: 'criou o cálculo', nova_versao: 'salvou', em_revisao: 'enviou para revisão', aprovado: 'aprovou', devolvido: 'devolveu para ajuste', entregue: 'marcou como entregue', arquivado: 'arquivou' }[e.acao] || e.acao)}${e.detalhe ? ' · ' + esc(e.detalhe) : ''}</div>`).join('')}</div>
      <div class="msg" id="cMsg"></div></div>`;
    box.querySelectorAll('[data-aba]').forEach(b => b.onclick = () => {
      box.querySelectorAll('[data-aba]').forEach(x => x.classList.toggle('on', x === b));
      box.querySelectorAll('[data-painel]').forEach(pn => { pn.hidden = pn.dataset.painel !== b.dataset.aba; });
    });
    box.querySelectorAll('[data-doc]').forEach(b => b.onclick = async () => { try { window.open(await CentralPC.linkDocumento(b.dataset.doc), '_blank'); } catch (e) { $('#cMsg').textContent = e.message; } });
    box.querySelectorAll('[data-st]').forEach(b => b.onclick = async () => {
      if (b.dataset.st === 'arquivado' && !confirm('Arquivar este cálculo? Ele sai da lista, mas continua guardado com todas as versões.')) return;
      try { await CentralPC.status(id, b.dataset.st); abrirCentral(id, null); } catch (e) { $('#cMsg').textContent = 'Não consegui: ' + e.message; }
    });
    const revisar = async res => {
      const lista = CentralPC.CHECKLIST.map((it, i) => ({ item: it, ok: $('#ck' + i).checked, obs: $('#ob' + i).value.trim() }));
      if (res === 'aprovado' && lista.some(x => !x.ok)) { $('#cMsg').textContent = 'Para aprovar, todos os itens precisam estar conferidos.'; return; }
      if (res === 'devolvido' && !lista.some(x => !x.ok && x.obs) && !$('#rvCom').value.trim()) { $('#cMsg').textContent = 'Para devolver, diga o que ajustar (observação no item ou comentário).'; return; }
      try { await CentralPC.revisar(id, v.numero, lista, res, $('#rvCom').value.trim()); abrirCentral(id, null); } catch (e) { $('#cMsg').textContent = 'Não consegui: ' + e.message; }
    };
    if ($('#rvOk')) { $('#rvOk').onclick = () => revisar('aprovado'); $('#rvDev').onclick = () => revisar('devolvido'); }
  }

  // compara com o contador (quando o caso veio de um PJC)
  function conferir(v, calc){
    const esp = (v.esperado || []).filter(o => o.ativo);
    if (!esp.length) return null;
    const usados = new Set(); let ok = 0; const errados = new Set();
    for (const e of esp) {
      const i = calc.ocorrencias.findIndex((o, k) => !usados.has(k) && o.ini === e.ini && (!e.aquisitivoIni || o.aquisitivoIni === e.aquisitivoIni));
      if (i < 0) continue; usados.add(i);
      const o = calc.ocorrencias[i];
      if (Math.abs(o.devido - (e.devido || 0)) <= 0.011 && Math.abs(o.pago - (e.pago || 0)) <= 0.011) ok++; else errados.add(i);
    }
    return {ok, n: esp.length, errados};
  }

  function mostrar(caso){
    const p = caso.parametros, ct = p.contrato, at = p.atualizacao;
    const r = MotorPC.calcular(caso, TABELAS), t = r.totais;
    const ativas = r.verbas.filter(v => v.ativa && v.ocorrencias.some(o => o.devido || o.pago));
    let okT = 0, nT = 0;
    const conf = {};
    for (const v of ativas) { const pv = p.verbas.find(x => x.id === v.id); const c = conferir(pv, v); conf[v.id] = c; if (c) { okT += c.ok; nT += c.n; } }
    // totais finais contra o resumo do contador
    const esp = (caso.esperado || {}).totais || {};
    const pares = [['Líquido', 'valorPrincipal', 'liquido'], ['FGTS', 'fgtsDepositoContaVinculada', 'fgts'], ['INSS reclamante', 'inssReclamante', 'inssReclamante'],
                   ['INSS reclamado', 'inssReclamado', 'inssReclamado'], ['Imposto de renda', 'impostoRenda', 'impostoRenda']];
    const totConf = pares.filter(([, k]) => esp[k] != null && esp[k] !== 'null').map(([n, k, m]) => ({ n, ok: Math.abs(+esp[k] - (t[m] || 0)) <= 0.011, esp: +esp[k], meu: t[m] || 0 }));
    const totOk = totConf.length && totConf.every(x => x.ok);
    const indice = at.combinarIndice && at.aPartirOutroIndice

    let selo = '';

      else selo = `<div class="selo parcial"><span>!</span><div><b>${okT} de ${nT} ocorrências iguais ao cálculo do contador</b>${totConf.filter(x => !x.ok).map(x => `${x.n}: ${brl(x.meu)} aqui e ${brl(x.esp)} no contador`).join(' · ') || 'Os totais conferem.'} As linhas diferentes aparecem destacadas no demonstrativo de cada verba.</div></div>`;

      return `<tr class="verba" data-id="${v.id}"><td><span class="seta">›</span> ${esc(v.nome)}<div class="tipo">${{Calculada:'verba principal',Reflexo:'reflexo',Informada:'valor informado'}[v.tipo]} · ${v.ocorrencias.length} ocorrência(s)</div></td>

      det('Contribuição previdenciária', 'por competência, com juros SELIC', ['Competência', 'Base', 'Alíq. segurado', 'Segurado', 'Empresa', 'SAT', 'Taxa SELIC', 'Juros'],

      })() : '',
      det('Imposto de renda', 'rendimentos recebidos acumuladamente; juros de mora não tributados', ['Período', 'Rendimentos', 'Meses', 'INSS', 'Desc. simplificado', 'Base', 'Imposto'],

          <label>Processo<input id="scCnj" value="${esc(caso.processo.cnj || '')}"></label>
          <label>Cliente<input id="scCli" list="scClis" placeholder="ex.: Bridgestone"></label>
          <label>Tipo de cálculo<select id="scTipo" style="width:100%">${Object.entries(CentralPC.TIPOS).map(([k, v]) => `<option value="${k}" ${k === 'liquidacao' ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
          <label>Reclamante<input id="scRte" value="${esc(caso.processo.reclamante || '')}"></label>
          <label>Reclamado<input id="scRdo" value="${esc(caso.processo.reclamado || '')}"></label></div>
        <datalist id="scClis"><option>Bridgestone</option><option>CBC</option></datalist>
        <button class="btn pri" type="button" id="scOk">Salvar</button> <span id="scMsg" style="font-size:13px"></span>`;
      document.getElementById('scOk').onclick = async () => {
        const msg = t => { document.getElementById('scMsg').innerHTML = t; };
        const u = await CentralPC.eu().catch(() => null);
        if (!u || u.semCadastro) { msg('Entre na central primeiro: <a href="index.html" target="_blank">fazer login</a>.'); return; }
        const cnj = document.getElementById('scCnj').value.trim(), cli = document.getElementById('scCli').value.trim();
        if (!cnj || !cli) { msg('Informe o processo e o cliente.'); return; }
        try {
          const res = await CentralPC.salvar({ cnj, cliente: cli, tipo: document.getElementById('scTipo').value,
            reclamante: document.getElementById('scRte').value.trim(), reclamado: document.getElementById('scRdo').value.trim(),
            data_liquidacao: ct.liquidacao, caso, totais: r.totais, motor: MotorPC.versao });
          msg(`Salvo na central, versão ${res.versao}. <a href="resultado.html?id=${res.id}">Abrir pela central</a>`);
        } catch (e) { msg('Não consegui salvar: ' + esc(e.message)); }
      };
    };

    // ---------- acordo ----------
    const ultSelic = Object.values(TABELAS.selicInss).map(x => x[1]).sort().pop();
    document.getElementById('acIni').value = (ct.admissao || '').slice(0, 7);
    document.getElementById('acFim').value = (ct.demissao || '').slice(0, 7);
    document.getElementById('acSelic').value = ultSelic;
    let ultimoAcordo = null;
    document.getElementById('acCalc').onclick = () => {
      const v = id => document.getElementById(id).value, n = x => +String(x || '').replace(/\./g, '').replace(',', '.') || 0;
      const liq = n(v('acLiq'));
      if (!liq || !v('acIni') || !v('acFim') || !v('acPag') || !v('acSelic')) { document.getElementById('acRes').innerHTML = '<p style="color:var(--muted)">Preencha o valor líquido, o período, a data do pagamento e o mês da SELIC.</p>'; return; }
      const itens = AcordoPC.percentuaisDoCalculo(caso, r);
      const a = AcordoPC.calcular(TABELAS, { liquido: liq, itens, periodo: { ini: v('acIni') + '-01', fim: v('acFim') + '-28' }, pagamento: v('acPag'), selicAte: v('acSelic'), honorariosPct: n(v('acHon')) });
      ultimoAcordo = a; document.getElementById('acPdf').disabled = false;
      document.getElementById('acRes').innerHTML = `<div class="grid2" style="margin-top:0">
        <table class="tbl res"><tbody>
          <tr><td>Parcelas do acordo sem FGTS e multa (líquidas)</td><td class="n">${brl(a.liquidoConferido - a.valorFgts - a.valorMulta)}</td></tr>
          <tr><td>FGTS</td><td class="n">${brl(a.valorFgts)}</td></tr><tr><td>Multa de 40% do FGTS</td><td class="n">${brl(a.valorMulta)}</td></tr>
          <tr class="sub"><td>Valor bruto</td><td class="n">${brl(a.bruto)}</td></tr>
          <tr><td>INSS do reclamante</td><td class="n neg">(${brl(a.inssReclamante)})</td></tr><tr><td>Imposto de renda</td><td class="n neg">(${brl(a.ir)})</td></tr>
          <tr class="tot"><td>Valor líquido</td><td class="n">${brl(a.liquidoConferido)}</td></tr>
          <tr><td>INSS da empresa (empresa, SAT e terceiros)</td><td class="n">${brl(a.inssEmpresa)}</td></tr>
          <tr><td>Juros SELIC do INSS</td><td class="n">${brl(a.selic)}</td></tr><tr><td>Honorários advocatícios</td><td class="n">${brl(a.honorarios)}</td></tr>
          <tr class="tot"><td>Custo total do acordo</td><td class="n">${brl(a.custoTotal)}</td></tr></tbody></table>
        <div class="scroll"><table class="tbl"><thead><tr><th>Verba</th><th>Natureza</th><th class="n">%</th><th class="n">Valor</th></tr></thead><tbody>
          ${a.linhas.map(l => `<tr><td>${esc(l.nome)}</td><td>${l.natureza === 'salarial' ? 'Salarial' : 'Indenizatória'}</td><td class="n">${num(l.pct * 100)}%</td><td class="n">${brl(l.valor)}</td></tr>`).join('')}
        </tbody></table></div></div>
        <p style="font-size:12px;color:var(--muted);margin:8px 0 0">INSS sobre ${brl(a.baseInss)} de verbas salariais, repartidas em ${a.competencias} competências (${brl(a.baseInss / a.competencias)} por mês). IR pelos rendimentos acumulados: ${brl(a.irMensal)} por mês. ${esc(a.regraSelic)}.</p>`;
    };
    document.getElementById('acPdf').onclick = () => ultimoAcordo && SaidasPC.abrirPdfAcordo(caso, ultimoAcordo);

    // ---------- impugnação ou concordância ----------
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    let comp = null, deles = null;
    // o relatório do PJe-Calc às vezes vem com a página girada por dentro (as linhas no outro eixo):
    // monta as linhas nas duas orientações e fica com a que reconhece mais verbas
    async function linhasDoPdf(arq, girado) {
      const pdf = await pdfjsLib.getDocument({ data: await arq.arrayBuffer() }).promise, out = [];
      const [lin, col, ordem] = girado ? [4, 5, 1] : [5, 4, -1];
      for (let n = 1; n <= Math.min(pdf.numPages, 6); n++) {
        const its = (await (await pdf.getPage(n)).getTextContent()).items.filter(i => i.str.trim()), grupos = {};
        for (const i of its) { const k = Math.round(i.transform[lin] / 2); (grupos[k] = grupos[k] || []).push(i); }
        Object.keys(grupos).sort((a, b) => ordem * (a - b)).forEach(k => out.push(grupos[k].sort((a, b) => a.transform[col] - b.transform[col]).map(i => i.str).join(' ').replace(/\s+/g, ' ').trim()));
      }
      return out;
    }
    async function lerImp(arq) {
      const res = document.getElementById('impRes'); res.innerHTML = '<p style="color:var(--muted)">Lendo o cálculo…</p>';
      try {
        const a = ImpugnacaoPC.lerCalculoPjeCalc(await linhasDoPdf(arq, false)), b = ImpugnacaoPC.lerCalculoPjeCalc(await linhasDoPdf(arq, true));
        deles = b.verbas.length > a.verbas.length ? b : a;
        if (!deles.verbas.length && deles.liquido == null) { res.innerHTML = '<div class="veredito no">Não reconheci o resumo do PJe-Calc nesse PDF. Por enquanto a leitura funciona com o relatório do PJe-Calc (página "Resumo do Cálculo").</div>'; return; }
        comp = ImpugnacaoPC.comparar(caso, r, deles, 1);
        desenhaImp();
      } catch (e) { res.innerHTML = `<div class="veredito no">Não consegui ler: ${esc(e.message)}</div>`; }
    }
    function desenhaImp() {
      const res = document.getElementById('impRes'), div = comp.linhas.filter(l => l.aMaior), menor = comp.linhas.filter(l => l.diverge && !l.aMaior);
      res.innerHTML = `<div class="veredito ${comp.concorda ? 'ok' : 'no'}">${comp.concorda
          ? `<b>Nada apurado a maior.</b> Nenhuma verba nem total acima do nosso cálculo (tolerância de R$ 1,00): a minuta sai como <b>concordância</b>.${menor.length ? ` ${menor.length} verba(s) foram apuradas a menor, o que não prejudica a reclamada.` : ''}`
          : `<b>${div.length} verba(s) apurada(s) a maior</b>, que vão para a impugnação.${menor.length ? ` Outras ${menor.length} foram apuradas a menor: aparecem na tabela, mas não são impugnadas.` : ''} Líquido do cálculo apresentado ${brl(deles.liquido)} x nosso ${brl(r.totais.liquido)}.`}
          ${deles.avisos.length ? `<div style="margin-top:6px;font-size:12.5px">${deles.avisos.length} linha(s) do PDF não conferiram e ficaram de fora.</div>` : ''}</div>
        <div class="scroll"><table class="tbl"><thead><tr><th>Verba</th><th class="n">Cálculo apresentado</th><th class="n">Nosso cálculo</th><th class="n">Diferença</th></tr></thead><tbody>
          ${comp.linhas.map(l => `<tr class="${l.aMaior ? 'dv' : ''}"><td>${esc(l.nome)}${l.soDeles ? ' <span class="tipo">só no cálculo apresentado</span>' : ''}${l.nomeDeles && l.nomeDeles !== l.nome && !l.soDeles ? `<div class="tipo">lá: ${esc(l.nomeDeles)}</div>` : ''}</td>
            <td class="n">${brl(l.deles)}</td><td class="n">${brl(l.nosso)}</td><td class="n d">${l.aMaior ? brl(l.dif) + ' a maior' : l.diverge ? '<span style="color:var(--muted);font-weight:400">' + brl(l.dif) + ' a menor</span>' : 'igual'}</td></tr>`).join('')}
          ${comp.totais.map(x => `<tr class="tot ${x.diverge ? 'dv' : ''}"><td>${esc(x.nome)}</td><td class="n">${brl(x.deles)}</td><td class="n">${brl(x.nosso)}</td><td class="n d">${x.diverge ? brl(x.dif) : 'igual'}</td></tr>`).join('')}
        </tbody></table></div>
        ${div.length ? `<h3 style="font-size:14px;margin:14px 0 6px">Fundamento de cada item impugnado <span class="tipo">opcional · vai para a minuta</span></h3>
          ${div.map((l, i) => `<div style="margin:6px 0"><b style="font-size:13px">${esc(l.nome)}</b><textarea data-fund="${i}" placeholder="Ex.: a sentença (p. 12) defere o adicional sobre o salário mínimo; o cálculo usou o salário base."></textarea></div>`).join('')}` : ''}
        <div class="saidas"><label style="font-size:13px">Peça <select id="impPeca">${Object.entries(ImpugnacaoPC.PECAS).map(([k, n]) => `<option value="${k}" ${k === (comp.concorda ? 'concordancia' : 'impugnacao') ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
          <button class="btn pri" type="button" id="impWord">Gerar em Word</button><span>Sai no papel timbrado, com vara, partes, valores e assinaturas. Só o que faltar fica em amarelo.</span></div>`;
      document.getElementById('impWord').onclick = async () => {
        const fund = {}; div.forEach((l, i) => { const t = document.querySelector(`[data-fund="${i}"]`); if (t && t.value.trim()) fund[l.nome] = t.value.trim(); });
        await gerarPeca(document.getElementById('impPeca').value, fund, document.getElementById('impWord'));
      };
    }
    // dados da peça: vara pelo código do CNJ; advogado e OAB lembrados neste navegador
    const lembra = (id, chave) => { const el = document.getElementById(id); try { el.value = localStorage.getItem(chave) || ''; } catch (e) {} el.onchange = () => { try { localStorage.setItem(chave, el.value.trim()); } catch (e) {} }; return el; };
    document.getElementById('impVara').value = ImpugnacaoPC.varaDoCnj(caso.processo.cnj).vara;
    const impAdv = lembra('impAdv', 'pc-peca-adv'); lembra('impOab', 'pc-peca-oab');
    if (!impAdv.value && window.CentralPC) CentralPC.eu().then(u => { if (u && u.nome && !impAdv.value) impAdv.value = u.nome; }).catch(() => {});
    async function gerarPeca(peca, fund, btn) {
      const txt = btn.textContent; btn.disabled = true; btn.textContent = 'Gerando…';
      try {
        const blob = await ImpugnacaoPC.minutaDocx({ peca, comparacao: comp, deles, r, parte: document.getElementById('impParte').value,
          cnj: caso.processo.cnj, reclamante: caso.processo.reclamante, reclamado: caso.processo.reclamado, dataLiquidacao: dt(ct.liquidacao), fundamentos: fund || {},
          vara: document.getElementById('impVara').value.trim(), advogado: impAdv.value.trim(), oab: document.getElementById('impOab').value.trim() });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = `${ImpugnacaoPC.PECAS[peca]} ${caso.processo.cnj || ''}.docx`; a.click();
      } catch (e) { alert('Não consegui gerar a peça: ' + e.message); }
      finally { btn.disabled = false; btn.textContent = txt; }
    }
    document.getElementById('impManif').onclick = () => gerarPeca('manifestacao', {}, document.getElementById('impManif'));
    const dz = document.getElementById('impDz'), arqImp = document.getElementById('impArq');
    dz.onclick = () => arqImp.click();
    arqImp.onchange = e => e.target.files[0] && lerImp(e.target.files[0]);
    dz.ondragover = e => { e.preventDefault(); dz.classList.add('sobre'); };
    dz.ondragleave = () => dz.classList.remove('sobre');
    dz.ondrop = e => { e.preventDefault(); dz.classList.remove('sobre'); const f = [...e.dataTransfer.files].find(x => /\.pdf$/i.test(x.name)); if (f) lerImp(f); };
    document.querySelectorAll('tr.verba').forEach(tr => tr.addEventListener('click', () => {
      const id = tr.dataset.id, det = document.querySelector(`tr[data-det="${id}"]`);
      const abrir = det.hidden; det.hidden = !abrir; tr.classList.toggle('aberta', abrir);
      if (abrir && !det.dataset.ok) {
        const v = ativas.find(x => x.id === id), errados = (conf[id] || {}).errados || new Set();
        det.firstElementChild.innerHTML = `<div class="wrap"><table class="mini"><thead><tr><th>Período</th><th>Base</th><th>Mult.</th><th>Divisor</th><th>Qtd.</th><th>Devido</th><th>Pago</th><th>Índice</th><th>Corrigido</th><th>Juros</th></tr></thead><tbody>${
          v.ocorrencias.map((o, i) => `<tr class="${errados.has(i) ? 'x' : ''}"><td>${dt(o.ini)}${o.fim && o.fim !== o.ini ? ' a ' + dt(o.fim) : ''}${o.origem === 'informado' ? '<span class="inf">informado</span>' : ''}</td>
            <td>${num(o.base)}</td><td>${num(o.mult, 4)}</td><td>${num(o.divisor, 0)}</td><td>${num(o.qtd, o.qtd % 1 ? 2 : 0)}</td>
            <td>${num(o.devido)}</td><td>${num(o.pago)}</td><td>${num(o.indice, 7)}</td><td>${num(o.corrigido)}</td><td>${num(o.juros || 0)}</td></tr>`).join('')
        }</tbody></table></div>`;
        det.dataset.ok = 1;
      }
    }));
  }
  function MotorPC_diaAntes(s){ const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() - 1); return d.toISOString().slice(0, 10); }
})();
</script>

<script>
CentralPC.eu().then(u => { const e = document.getElementById('navEquipe'); if (e && u && u.papel === 'admin') e.hidden = false; }).catch(() => {});
</script>
</body>
